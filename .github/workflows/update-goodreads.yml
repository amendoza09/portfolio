name: Update Goodreads Currently Reading

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Fetch Goodreads currently-reading shelf
        run: node scripts/fetch-goodreads.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/goodreadsCurrentlyReading.json
          git diff --cached --quiet || git commit -m "chore: update Goodreads currently reading"
          git push
